[env:heltec-v3]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec V3
custom_meshtastic_images = heltec-v3.svg, heltec-v3-case.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3
  ; LoPhi: these two radios are a fixed point-to-point pair with no GPS, no
  ; other mesh nodes, no attached I2C sensors, and no internet at the barn -
  ; exclude Meshtastic features tied to hardware/use cases we don't have, to
  ; free flash for our own fieldcontrol code. See docs/architecture.md for the
  ; full analysis (what's excluded here, what's kept and why).
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -D MESHTASTIC_EXCLUDE_WAYPOINT=1
  -D MESHTASTIC_EXCLUDE_TRACEROUTE=1
  ; NOT excluding ENVIRONMENTAL_SENSOR: VoltageSensor.h (used by core battery/
  ; fuel-gauge monitoring, e.g. MAX17048Sensor) is upstream-miscoupled to this
  ; flag and fails to compile without it - a real bug, not something safe to
  ; flip. See docs/architecture.md.
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_MQTT=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
